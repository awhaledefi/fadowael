:root{
  --paper:#F3F1E9;
  --paper-hi:#FCFBF6;
  --paper-lo:#E4E0D2;
  --ink:#1C2333;
  --navy:#22345C;
  --navy-soft:rgba(34,52,92,.42);
  --gold:#AE8C4C;
  --gold-lt:#D9C08A;
  --stem:#9B9C87;
  --stem-lt:#B7B7A2;
  --bloom:#FBF9F3;
  --bloom-sh:#DFD9C7;
  --en:'CormorantG',Georgia,'Times New Roman',serif;
  --ar:'Amiri','Geeza Pro','Al Bayan',serif;
  --ease:cubic-bezier(.16,1,.3,1);
  --t0:950ms;  /* card content waits for the doors */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  font-family:var(--en);
  touch-action:manipulation;
}
/* own the whole viewport, whatever the host page does to <body> */
.stage{
  position:fixed;inset:0;z-index:0;
  display:grid;place-items:center;
  overflow:hidden;
  background:radial-gradient(120% 90% at 50% 8%,#2B3550 0%,#1A2134 42%,#11151F 100%);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

/* ---------- card ---------- */
.card{
  position:relative;
  aspect-ratio:1000/1420;
  width:min(96vw,calc(96dvh * .7042));
  height:auto;
  container-type:size;
  background:
    radial-gradient(130% 100% at 30% 0%,var(--paper-hi) 0%,var(--paper) 46%,var(--paper-lo) 122%);
  border-radius:2px;
  overflow:hidden;
  transform:translate3d(0,14px,0) scale(.965);
  opacity:0;
  will-change:transform,opacity;
  box-shadow:
    0 1px 1px rgba(10,14,24,.30),
    0 10px 22px rgba(10,14,24,.34),
    0 34px 70px rgba(6,9,16,.46),
    0 0 0 .5px rgba(255,255,255,.10);
}
.armed .card{animation:cardIn 820ms var(--ease) forwards}
.armed.play .card{animation:cardIn 820ms var(--ease) forwards,
                            settle 900ms 800ms cubic-bezier(.22,1,.32,1) forwards}
@keyframes cardIn{to{transform:translate3d(0,0,0) scale(1);opacity:1}}
@keyframes settle{0%{transform:scale(1.05)}100%{transform:none}}

/* paper grain + sheen */
.grain,.sheen{position:absolute;inset:0;pointer-events:none}
.grain{opacity:.5;mix-blend-mode:multiply;
  background-image:var(--grain);background-size:190px 190px}
.sheen{
  background:linear-gradient(102deg,rgba(255,255,255,0) 32%,rgba(255,255,255,.55) 47%,rgba(255,255,255,0) 62%);
  opacity:0;transform:translate3d(-38%,0,0);mix-blend-mode:screen}
.play .sheen{animation:sheen 2600ms var(--ease) forwards;animation-delay:calc(300ms + var(--t0))}
@keyframes sheen{0%{opacity:0;transform:translate3d(-40%,0,0)}22%{opacity:.5}100%{opacity:0;transform:translate3d(46%,0,0)}}

/* ---------- frames ---------- */
.frames{position:absolute;inset:0;pointer-events:none}
/* each side draws in turn, like a pen tracing the frame */
.frames .fl{fill:none;stroke-linecap:square;stroke-dasharray:var(--len);stroke-dashoffset:var(--len)}
.fg .fl{stroke:var(--gold);stroke-width:2.4;opacity:.92}
.fn .fl{stroke:var(--navy);stroke-width:1.5;opacity:.5}
.play .frames .fl{animation:draw var(--dur) linear forwards;animation-delay:calc(var(--d) + var(--t0))}
@keyframes draw{to{stroke-dashoffset:0}}
.tick{stroke:var(--navy);stroke-width:2;opacity:0}
.play .tick{animation:fadeIn 700ms var(--ease) forwards;animation-delay:calc(1350ms + var(--t0))}
@keyframes fadeIn{to{opacity:.55}}

/* ---------- flora ---------- */
.spray{position:absolute;will-change:transform}
.spray svg{overflow:visible;display:block;width:100%;height:100%;
  transform-origin:var(--tox,50%) var(--toy,50%);will-change:transform}
.spray .stem{fill:none;stroke:var(--stem);stroke-width:.9;stroke-linecap:round;opacity:0}
.spray .stem.thin{stroke:var(--stem-lt);stroke-width:.6}
.play .spray .stem{animation:fadeIn2 900ms var(--ease) forwards;animation-delay:calc(var(--d) + var(--t0))}
@keyframes fadeIn2{to{opacity:.85}}
.spray .bl{transform-box:fill-box;transform-origin:center;opacity:0;transform:scale(.2)}
.play .spray .bl{animation:bloom 760ms var(--ease) forwards;animation-delay:calc(var(--d) + var(--t0))}
@keyframes bloom{60%{opacity:1}to{opacity:1;transform:scale(1)}}
/* branches: slow rotate on the svg, independent slower rise-and-settle on the wrapper */
.play .sway svg{animation:sway var(--sd,7s) ease-in-out infinite alternate;animation-delay:var(--sdel,0s)}
@keyframes sway{from{transform:rotate(calc(var(--sa,.7deg) * -1)) translate3d(-.35%,0,0)}
  to{transform:rotate(var(--sa,.7deg)) translate3d(.35%,0,0)}}
.play .spray{animation:woodBob var(--wd,9s) ease-in-out infinite alternate;animation-delay:var(--wdel,0s)}
@keyframes woodBob{from{transform:translate3d(0,-1.9%,0)}to{transform:translate3d(0,2.4%,0)}}

/* petals drifting down off the branches */
.petals{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.petals .p{position:absolute;opacity:0;will-change:transform,opacity}
.petals .p i{display:block;border-radius:50% 50% 50% 12%;
  background:var(--bloom);box-shadow:0 0 0 .5px var(--bloom-sh);will-change:transform}
/* fall carries it down, flutter makes it drift sideways -- two elements so the paths stay independent */
.play .petals .p{animation:fall var(--pd) linear infinite;animation-delay:var(--pdel)}
.play .petals .p i{animation:flutter var(--fl) ease-in-out infinite alternate;animation-delay:var(--pdel)}
@keyframes fall{
  0%{opacity:0;transform:translate3d(0,0,0)}
  10%{opacity:var(--po,.55)}
  80%{opacity:var(--po,.55)}
  100%{opacity:0;transform:translate3d(var(--px),var(--py),0)}}
@keyframes flutter{
  from{transform:translate3d(calc(var(--pa) * -1),0,0) rotate(calc(var(--pr) * -1))}
  to{transform:translate3d(var(--pa),0,0) rotate(var(--pr))}}

/* ---------- content ---------- */
.content{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:1.7cqw;
  padding:12cqw 11cqw 26cqw;
  text-align:center;color:var(--ink);
}
.r{opacity:0;transform:translate3d(0,10px,0);will-change:transform,opacity}
.play .r{animation:rise 900ms var(--ease) forwards;animation-delay:calc(var(--d) + var(--t0))}
@keyframes rise{to{opacity:1;transform:translate3d(0,0,0)}}

.eyebrow{font-style:italic;font-weight:300;font-size:4.3cqw;letter-spacing:.06em;color:#585c56}
.eyebrow-ar{font-family:var(--ar);font-size:3.7cqw;letter-spacing:.02em;color:#6b6f68;margin-top:.2cqw}

.names-ar{font-family:var(--ar);font-size:10.8cqw;line-height:1.3;color:var(--ink);letter-spacing:.01em;margin-top:.6cqw;white-space:nowrap}
.names-ar .amp{color:var(--gold);font-size:.66em;padding:0 .26em;vertical-align:.07em}
.names-en{font-size:4.8cqw;letter-spacing:.36em;text-indent:.36em;font-weight:400;color:#333a48;white-space:nowrap}

.rule{width:44cqw;height:1px;background:linear-gradient(90deg,transparent,var(--navy) 18%,var(--navy) 82%,transparent);opacity:.55;transform:scaleX(0);transform-origin:center}
.play .rule{animation:ruleIn 900ms var(--ease) forwards;animation-delay:calc(var(--d) + var(--t0))}
@keyframes ruleIn{to{transform:scaleX(1)}}
.rule.gold{background:linear-gradient(90deg,transparent,var(--gold) 20%,var(--gold) 80%,transparent);opacity:.7;width:30cqw}

.invite{font-style:italic;font-weight:300;font-size:3.9cqw;color:#585c56;letter-spacing:.03em}
.invite-ar{font-family:var(--ar);font-size:3.5cqw;color:#6b6f68}
.event{font-size:5.1cqw;letter-spacing:.3em;text-indent:.3em;color:#2a3140;line-height:1.26;white-space:nowrap}
.event-ar{font-family:var(--ar);font-size:6.5cqw;color:var(--navy);line-height:1.5;margin-top:-.2cqw}

.details{display:flex;align-items:stretch;justify-content:center;gap:4.6cqw;margin-top:1.4cqw}
.details .col{display:flex;flex-direction:column;gap:.55cqw;min-width:30cqw}
.details .col.ca-l{text-align:right}
.details .col.ca-r{text-align:left}
.vrule{width:1px;background:linear-gradient(180deg,transparent,var(--navy) 16%,var(--navy) 84%,transparent);opacity:.42;transform:scaleY(0);transform-origin:center}
.play .vrule{animation:vruleIn 850ms var(--ease) forwards;animation-delay:calc(var(--d) + var(--t0))}
@keyframes vruleIn{to{transform:scaleY(1)}}
.details .en{font-size:2.9cqw;letter-spacing:.12em;color:#3d4453;font-variant-numeric:tabular-nums;white-space:nowrap}
.details .ar{font-family:var(--ar);font-size:3.1cqw;color:#4a5162;line-height:1.55;white-space:nowrap}
.details .sm{font-style:italic;font-size:2.9cqw;letter-spacing:.02em;color:#6a6e68}

.orn{margin-top:1.2cqw}
.orn svg{width:34cqw;display:block;overflow:visible}
.orn line{stroke:var(--gold);stroke-width:.7;vector-effect:non-scaling-stroke;opacity:.7}
.orn path{fill:var(--gold);opacity:.9}

/* ---------- swans / water ---------- */
.lake{position:absolute;left:0;right:0;bottom:0;height:28cqw;pointer-events:none;overflow:hidden}
.waterline{position:absolute;left:11cqw;right:11cqw;bottom:11cqw;height:1px;
  background:linear-gradient(90deg,transparent,var(--navy) 20%,var(--navy) 80%,transparent);opacity:.42;
  transform:scaleX(0);transform-origin:center}
.waterline.b{bottom:8.8cqw;left:26cqw;right:26cqw;opacity:.2}

    w.style.cssText=`left:${x.toFixed(1)}%;top:${y.toFixed(1)}%;`+
      `--px:${(pr()*14-7).toFixed(1)}cqw;--py:${(26+pr()*40).toFixed(1)}cqw;`+
      `--pd:${(11+pr()*9).toFixed(1)}s;--pdel:${(-pr()*18).toFixed(1)}s;--po:${(.42+pr()*.3).toFixed(2)};`+
      `--pa:${(1.8+pr()*3).toFixed(1)}cqw;--pr:${(60+pr()*140).toFixed(0)}deg;--fl:${(1.7+pr()*1.7).toFixed(1)}s`;
    e.style.cssText=`width:${sz}cqw;height:${sz}cqw`;
    w.appendChild(e);pet.appendChild(w);
  };
  /* read the blossoms the sprays actually drew, so petals fall out of the foliage */
  requestAnimationFrame(()=>{
    const cr=document.getElementById('card').getBoundingClientRect();
    const blooms=[...document.querySelectorAll('.spray .bl')].map(el=>{
      const r=el.getBoundingClientRect();
      return [(r.left+r.width/2-cr.left)/cr.width*100,(r.top+r.height/2-cr.top)/cr.height*100];
    }).filter(([x,y])=>x>-4&&x<104&&y>-2&&y<84);
    if(!blooms.length){                       /* fallback if layout is not ready */
      [[78,10],[88,4],[16,80],[8,70],[70,16],[22,78],[84,20]].forEach(([x,y])=>dropPetal(x,y));
      return;
    }
    const step=Math.max(1,Math.floor(blooms.length/15));
    for(let i=0;i<blooms.length&&pet.children.length<15;i+=step){
      const [x,y]=blooms[i];
      dropPetal(x+(pr()-.5)*2,y+(pr()-.5)*2);
    }
  });

  /* ---- the door, laid on stroke by stroke ---- */
  const PAL=[[24,40,78],[30,56,106],[42,82,140],[64,114,174],[104,152,202],[156,192,222],[212,229,242]];
  const OCHRE=[[196,138,58],[158,94,34],[228,180,92]];
  const TEAL=[[36,104,116],[52,138,142]];
  const ramp=t=>{
    t=t<0?0:t>1?1:t;
    const f=t*(PAL.length-1), i=Math.min(PAL.length-2,Math.floor(f)), k=f-i;
    const a=PAL[i], b=PAL[i+1];
    return [a[0]+(b[0]-a[0])*k, a[1]+(b[1]-a[1])*k, a[2]+(b[2]-a[2])*k];
  };
  const rgb=(c,o)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${o===undefined?1:o})`;
  const shift=(c,d)=>[c[0]+d,c[1]+d*1.02,c[2]+d*.92];

  /* panel layout in normalised leaf coords; x=1 is the meeting stile */
  const PANELS=[[.17,.072,.84,.446],[.17,.552,.84,.928]];
  const inPanel=(u,v)=>{
    for(let i=0;i<PANELS.length;i++){
      const q=PANELS[i];
      if(u>q[0]&&u<q[2]&&v>q[1]&&v<q[3])return i+1;
    }
    return 0;
  };
  /* distance to the nearest panel border, for the groove shading */
  const edgeD=(u,v)=>{
    let m=9;
    for(const q of PANELS){
      const dx=Math.min(Math.abs(u-q[0]),Math.abs(u-q[2])), dy=Math.min(Math.abs(v-q[1]),Math.abs(v-q[3]));
      const inx=u>q[0]-.05&&u<q[2]+.05, iny=v>q[1]-.02&&v<q[3]+.02;
      if(inx&&iny)m=Math.min(m,Math.max(0,Math.min(dx*3.6,dy)));
    }
    return m;
  };

  function paintLeaf(cv,mirror,seed){
    const W=cv.width,H=cv.height,g=cv.getContext('2d'),r=rng(seed),S=W/400;
    /* the light falls from the hinge side of each leaf */
    const lit=u=>mirror?1-u:u;
    const dir=(u,v)=>{
      if(inPanel(u,v)) return Math.PI/2+Math.sin(v*9+u*3.4)*.30;      /* wavering vertical inside panels */
      if(v<.072||(v>.446&&v<.552)||v>.928) return Math.sin(u*7)*.22;  /* rails run across */
      return Math.PI/2+Math.sin(v*6)*.14;                              /* stiles run up */
    };
    const tone=(u,v)=>{
      let t=.52;
      if(inPanel(u,v))t-=.13;
      const L=lit(u);
      t+=(.36-Math.abs(L-.38))*.86;        /* a band of light down the leaf */
      t-=v*.24;                             /* the foot falls into shadow */
      t+=Math.sin(v*5.5+u*2)*.045;          /* the paint is never laid evenly */
      const e=edgeD(u,v);
      if(e<.016)t-=(.016-e)*15;             /* the groove round each panel */
      return t;
    };
    /* ground colour so gaps between strokes read as underpainting, not paper */
    const bg=g.createLinearGradient(0,0,W*.5,H);
    bg.addColorStop(0,'#2C548C');bg.addColorStop(.55,'#25467A');bg.addColorStop(1,'#1A3055');
    g.fillStyle=bg;g.fillRect(0,0,W,H);

    const stroke=(x,y,a,len,wid,col,hi)=>{
      const dx=Math.cos(a)*len*.5, dy=Math.sin(a)*len*.5;
      const nx=-Math.sin(a), ny=Math.cos(a);
      g.lineCap='round';
      /* the shadow the ridge of paint casts */
      g.strokeStyle=rgb(shift(col,-34),.55);g.lineWidth=wid;
      g.beginPath();g.moveTo(x-dx+nx*wid*.22,y-dy+ny*wid*.22);g.lineTo(x+dx+nx*wid*.22,y+dy+ny*wid*.22);g.stroke();
      g.strokeStyle=rgb(col);g.lineWidth=wid;
      g.beginPath();g.moveTo(x-dx,y-dy);g.lineTo(x+dx,y+dy);g.stroke();
      if(hi){                                   /* the lit crest of the stroke */
        g.strokeStyle=rgb(shift(col,44),.75);g.lineWidth=wid*.3;
        g.beginPath();g.moveTo(x-dx-nx*wid*.28,y-dy-ny*wid*.28);g.lineTo(x+dx-nx*wid*.28,y+dy-ny*wid*.28);g.stroke();
      }
    };

    const N=Math.round(7200*S*S);
    for(let i=0;i<N;i++){
      const u=r(),v=r(),x=u*W,y=v*H;
      const a=dir(u,v)+(r()-.5)*.36;
      const long=r()<.09;                                        /* the odd long sweeping pass */
      const len=(8+r()*26)*(long?2.4:1)*S, wid=(2.2+r()*5)*S;
      let col, t=tone(u,v)+(r()-.5)*.2;
      const q=r();
      /* complementary accents sit where the paint is darkest, not scattered evenly */
      if(q<.014+(.5-t)*.05) col=shift(OCHRE[(r()*3)|0],(r()-.5)*36);
      else if(q<.028)       col=TEAL[(r()*2)|0];
      else                  col=ramp(t);
      stroke(x,y,a,len,wid,col,r()<.46);
    }
    /* darker contour round each panel, drawn in short wavering dabs */
    PANELS.forEach(q=>{
      const segs=[[q[0],q[1],q[2],q[1]],[q[2],q[1],q[2],q[3]],[q[2],q[3],q[0],q[3]],[q[0],q[3],q[0],q[1]]];
      segs.forEach(([x0,y0,x1,y1])=>{
        const n=Math.round(Math.hypot((x1-x0)*W,(y1-y0)*H)/(7*S));
        for(let i=0;i<n;i++){
          const t=i/n, u=x0+(x1-x0)*t, v=y0+(y1-y0)*t;
          const a=Math.atan2((y1-y0)*H,(x1-x0)*W)+(r()-.5)*.3;
          const off=(r()-.5)*3*S;
          stroke(u*W-Math.sin(a)*off,v*H+Math.cos(a)*off,a,(10+r()*10)*S,(3.6+r()*3)*S,ramp(.04+r()*.09),false);
        }
      });
      /* the light that catches on the bottom arris */
      const n2=Math.round((q[2]-q[0])*W/(11*S));
      for(let i=0;i<n2;i++){
        if(r()<.28)continue;                       /* the catch of light is broken, not a ruled line */
        const u=q[0]+(q[2]-q[0])*(i/n2+(r()-.5)*.02);
        stroke(u*W,(q[3]-.004+(r()-.5)*.004)*H,(r()-.5)*.34,(9+r()*10)*S,(2+r()*2)*S,
               shift(ramp(.8+r()*.16),(r()-.5)*26),true);
      }
    });
    /* leaf edges */
    for(let i=0;i<Math.round(H/(6*S));i++){
      const v=i/(H/(6*S));
      stroke(1.5*S,v*H,Math.PI/2+(r()-.5)*.3,(11+r()*8)*S,(3+r()*2)*S,ramp(.05+r()*.08),false);
      stroke(W-1.5*S,v*H,Math.PI/2+(r()-.5)*.3,(11+r()*8)*S,(3+r()*2)*S,ramp(.05+r()*.08),false);
    }

  }
  document.querySelectorAll('.face').forEach((f,i)=>{
    const mirror=f.parentNode.classList.contains('dr');
    const cv=document.createElement('canvas');
    cv.className='brush';cv.width=520;cv.height=1950;
    f.insertBefore(cv,f.firstChild);
    paintLeaf(cv,mirror,mirror?9173:4409);
  });

  /* ---- the doorway itself: stucco arch, steps, shrubs, lamp, bougainvillea ---- */
  (function scene(){
    const R=rng(521);
    const CX=500, CY=560, AR=268;                 /* arch centre + radius */
    let s='';
    /* wall recess */
    s+='<path class="stucco" d="M232 1210V560A268 268 0 0 1 768 560V1210Z"/>';
    s+='<path class="reveal" d="M262 1198V566A238 238 0 0 1 738 566V1198Z"/>';
    s+='<path class="shade" d="M262 1198V566A238 238 0 0 1 738 566V1198Z" opacity=".16"/>';
    s+='<path fill="none" stroke="#B4AC98" stroke-width="3.4" opacity=".5" d="M232 1210V560A268 268 0 0 1 768 560V1210"/>';
    s+='<path fill="none" stroke="#C9C1AC" stroke-width="1.8" opacity=".65" d="M262 1198V566A238 238 0 0 1 738 566V1198"/>';
    /* lintel + the shadowed reveal the door sits in */
    s+='<rect x="286" y="402" width="428" height="28" rx="5" fill="#CFC7B2"/>';
    s+='<rect x="286" y="402" width="428" height="28" rx="5" fill="none" stroke="#ABA28D" stroke-width="1.7" opacity=".65"/>';
    s+='<rect x="290" y="428" width="420" height="760" fill="#54637312" />';
    s+='<rect x="290" y="428" width="420" height="16" fill="#3F4C5A" opacity=".2"/>';

    /* wall lantern in the lunette */
    s+='<path d="M500 318V344" stroke="#3B4048" stroke-width="5" fill="none" stroke-linecap="round"/>';
    s+='<path class="lamp" d="M492 344h16l-4 -10h-8z"/>';
    s+='<path class="lamp" d="M484 352h32l-6 52h-20z"/>';
    s+='<path class="glow" d="M489 357h22l-4.6 42h-12.8z" opacity=".9"/>';
    s+='<path d="M484 352h32" stroke="#3B4048" stroke-width="4" fill="none" stroke-linecap="round"/>';
    s+='<path d="M490 404h20" stroke="#3B4048" stroke-width="4" fill="none" stroke-linecap="round"/>';
    s+='<circle cx="500" cy="410" r="3.6" class="lamp"/>';
    s+='<ellipse cx="500" cy="378" rx="46" ry="54" fill="#F6E3B4" opacity=".10"/>';

    /* stone steps, soft and slightly uneven */
    [[278,1184,444,32],[258,1214,484,36],[236,1248,528,42]].forEach(([x,y,w,h])=>{
      s+=`<rect class="stone" x="${x}" y="${y}" width="${w}" height="${h}" rx="7"/>`;
      s+=`<rect class="stone-l" x="${x}" y="${y}" width="${w}" height="${h}" rx="7" stroke-width="1.7"/>`;
      s+=`<rect x="${x}" y="${y}" width="${w}" height="6" rx="3" fill="#F1ECDE" opacity=".7"/>`;
      for(let j=0;j<4;j++){
        const sx=(x+46+R()*(w-92))|0;
        s+=`<path class="stone-l" d="M${sx} ${y+4}V${y+h-3}" stroke-width="1.2" opacity=".35"/>`;
      }
    });

    /* clipped shrubs either side of the steps */
    const bush=(cx,cy,rx,ry,seed)=>{
      const b=rng(seed);let o='';
      for(let i=0;i<52;i++){
        const a=b()*6.283,d=Math.sqrt(b());
        o+=`<circle class="${b()<.45?'bush2':'bush'}" cx="${(cx+Math.cos(a)*rx*d)|0}" cy="${(cy+Math.sin(a)*ry*d)|0}" r="${(10+b()*17)|0}" opacity="${(.5+b()*.45).toFixed(2)}"/>`;
      }
      return o;
    };
    s+=bush(198,1186,64,56,3)+bush(802,1174,60,52,9);

    /* ---- bougainvillea draped over the arch ---- */
    const BR=b=>{
      const r=(13+b()*7).toFixed(1), ry=(r*.6).toFixed(1);
      return `<ellipse class="brac" rx="${r}" ry="${ry}"/>`+
             `<ellipse class="brac2" rx="${r}" ry="${ry}" transform="rotate(118)"/>`+
             `<ellipse class="brac3" rx="${r}" ry="${ry}" transform="rotate(238)"/>`+
             '<circle class="core" r="2.6"/>';
    };
    /* one animated group per cluster keeps the bloom cheap on a phone */
    const cluster=(x,y,b,delay,dense)=>{
      const n=dense?(9+((b()*8)|0)):(4+((b()*5)|0));
      let o='';
      for(let i=0;i<n;i++){
        const a=b()*6.283, d=b()*(dense?30:20);
        const px=(Math.cos(a)*d)|0, py=(Math.sin(a)*d)|0;
        if(b()<.44){
          const ll=(26+b()*22)|0;
          o+=`<g transform="translate(${px} ${py}) rotate(${(b()*360)|0})">`+
             `<ellipse class="${b()<.5?'leaf2':'leaf3'}" cx="${(ll*.5)|0}" cy="0" rx="${(ll*.5)|0}" ry="${(ll*.34)|0}" opacity="${(.75+b()*.25).toFixed(2)}"/></g>`;
        }else{
          o+=`<g transform="translate(${px} ${py}) rotate(${(b()*360)|0}) scale(${(.8+b()*.55).toFixed(2)})">${BR(b)}</g>`;
        }
      }
      return `<g class="bl2" style="--d:${delay}ms" transform="translate(${x} ${y})">${o}</g>`;
    };
    const drape=(a0,a1,count,seed,base,weight)=>{
      const b=rng(seed); let o='';
      for(let i=0;i<3;i++){
        const off=AR+10+i*30+b()*18, pts=[];
        for(let t=0;t<=1.001;t+=.07){
          const a=a0+(a1-a0)*t, rr=off+Math.sin(t*7+i)*14;
          pts.push(`${(CX+Math.cos(a)*rr)|0} ${(CY+Math.sin(a)*rr*1.02)|0}`);
        }
        o+=`<path class="vine" d="M${pts.join('L')}" stroke-width="${(3.6-i*.8).toFixed(1)}" opacity=".5"/>`;
      }
      for(let i=0;i<count;i++){
        const t=i/count, a=a0+(a1-a0)*t+(b()-.5)*.07;
        const rr=AR+2+b()*(70+weight*115);
        const x=(CX+Math.cos(a)*rr)|0, y=(CY+Math.sin(a)*rr)|0;
        o+=cluster(x,y,b,base+i*6,b()<weight*.8+.15);
        if(b()<.3*weight+.1){
          const hl=(50+b()*120)|0;
          o+=`<g transform="translate(${x} ${y})"><g class="hang" style="--hd:${(4.6+b()*3.4).toFixed(1)}s;--hdel:${(-b()*5).toFixed(1)}s">`+
             `<path class="vine" d="M0 0Q${((b()-.5)*26)|0} ${(hl*.55)|0} 0 ${hl}" stroke-width="2" opacity=".5"/>`+
             cluster(0,hl,b,base+i*6+140,true)+'</g></g>';
        }
      }
      return o;
    };
    const D=Math.PI/180;
    s+=drape(186*D,296*D,58,11,60,1);      /* heavy mass spilling over the top-left */
    s+=drape(296*D,352*D,30,29,200,.6);     /* lighter run down the right */
    s+=drape(150*D,190*D,22,47,250,.85);    /* down the left jamb */
    s+=drape(238*D,318*D,22,71,120,.5);     /* a second pass over the crown for depth */

    document.getElementById('scene').innerHTML=
      `<svg viewBox="0 0 1000 1420" preserveAspectRatio="none">${s}</svg>`;
  })();

  /* ---- the lock, laid on with the same brush ---- */
  (function lockFace(){
    const cv=document.createElement('canvas');cv.width=cv.height=220;
    const g=cv.getContext('2d'),r=rng(6101),W=220,C=110,S=W/220;
    const dab=(x,y,a,len,wid,col,hi)=>{
      const dx=Math.cos(a)*len*.5,dy=Math.sin(a)*len*.5,nx=-Math.sin(a),ny=Math.cos(a);
      g.lineCap='round';
      g.strokeStyle=rgb(shift(col,-38),.6);g.lineWidth=wid;
      g.beginPath();g.moveTo(x-dx+nx*wid*.22,y-dy+ny*wid*.22);g.lineTo(x+dx+nx*wid*.22,y+dy+ny*wid*.22);g.stroke();
      g.strokeStyle=rgb(col);g.lineWidth=wid;
      g.beginPath();g.moveTo(x-dx,y-dy);g.lineTo(x+dx,y+dy);g.stroke();
      if(hi){g.strokeStyle=rgb(shift(col,50),.8);g.lineWidth=wid*.3;
        g.beginPath();g.moveTo(x-dx-nx*wid*.3,y-dy-ny*wid*.3);g.lineTo(x+dx-nx*wid*.3,y+dy-ny*wid*.3);g.stroke();}
    };
    /* backplate */
    g.save();g.beginPath();g.arc(C,C,104,0,6.283);g.clip();
    for(let i=0;i<1500;i++){
      const a=r()*6.283,d=Math.sqrt(r())*104,x=C+Math.cos(a)*d,y=C+Math.sin(a)*d;
      const lift=(1-d/104)*.30+(.5-Math.abs((x/W)-.38))*.5;
      const c=shift(OCHRE[(r()*3)|0],(lift-.28)*90+(r()-.5)*30);
      dab(x,y,Math.atan2(y-C,x-C)+1.57+(r()-.5)*.5,(9+r()*14)*S,(3+r()*4)*S,c,r()<.45);
    }
    g.restore();
    /* rim */
    for(let i=0;i<190;i++){
      const a=i/190*6.283+(r()-.5)*.05, d=104+(r()-.5)*5;
      dab(C+Math.cos(a)*d,C+Math.sin(a)*d,a+1.57,(13+r()*8)*S,(4+r()*3)*S,
          shift(OCHRE[1],(r()-.5)*40-18),r()<.5);
    }
    /* keyhole */
    g.fillStyle='rgba(16,12,4,.88)';
    g.beginPath();g.arc(C,C-10,17,0,6.283);g.fill();
    g.beginPath();g.moveTo(C-11,C+2);g.lineTo(C+11,C+2);g.lineTo(C+7,C+40);g.lineTo(C-7,C+40);g.closePath();g.fill();
    for(let i=0;i<70;i++){
      const a=r()*6.283,d=Math.sqrt(r())*30;
      dab(C+Math.cos(a)*d*.8,C+6+Math.sin(a)*d,r()*6.283,(6+r()*6)*S,(2+r()*2)*S,[36,26,10],false);
    }
    /* the light that sits on the top-left of the ring */
    for(let i=0;i<120;i++){
      const a=3.5+r()*1.5,d=88+r()*18;
      dab(C+Math.cos(a)*d,C+Math.sin(a)*d,a+1.57,(11+r()*9)*S,(2.4+r()*2)*S,shift(OCHRE[2],40),true);
    }
    document.getElementById('lock').appendChild(cv);
  })();

  /* ---- play ---- */
  const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;
  const B=document.body;
  const arm=()=>{
    B.classList.remove('play','gate-open','armed');
    void B.offsetWidth;
    B.classList.add('armed');
    if(reduced)open();
  };
  const open=()=>{
    if(B.classList.contains('gate-open'))return;
    B.classList.add('play','gate-open');
  };
  const start=arm;
  document.getElementById('lock').addEventListener('click',e=>{e.stopPropagation();open()});
  document.querySelector('.stage').addEventListener('click',()=>{
    if(B.classList.contains('gate-open'))arm();
  });
  let began=false;const go=()=>{if(began)return;began=true;start()};
  if(document.fonts&&document.fonts.ready){document.fonts.ready.then(()=>requestAnimationFrame(go))}
  else{requestAnimationFrame(go)}
  setTimeout(go,1500);  /* never leave the card blank if a font stalls */
})();
</script>
</body></html>
